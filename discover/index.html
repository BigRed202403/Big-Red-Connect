<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Discover with Big Red" />
  <title>Discover with Big Red</title>

  <style>
    :root{
      --red:#d71920;
      --panel:rgba(10,10,10,.94);
      --text:#fff;
      --muted:#c7c7c7;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .beta-shell{
      position:fixed;
      inset:0;
      background:#000;
    }

    #discoverFrame{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#000;
    }

    .status-stack{
      position:absolute;
      z-index:65;
      left:18px;
      top:max(16px,env(safe-area-inset-top));
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:7px;
      opacity:1;
      transform:translateY(0);
      transition:opacity 180ms ease,transform 180ms ease;
    }

    .status-toggle{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 13px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      background:rgba(0,0,0,.66);
      color:#fff;
      font:850 14px/1 system-ui,-apple-system,sans-serif;
      letter-spacing:.02em;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .status-dot{
      width:10px;
      height:10px;
      flex:0 0 auto;
      border-radius:50%;
      background:#e11;
      box-shadow:0 0 10px rgba(225,17,17,.45);
    }

    .status-toggle.ready{
      border-color:rgba(47,200,94,.62);
    }

    .status-toggle.ready .status-dot{
      background:#2fc85e;
      box-shadow:0 0 10px rgba(47,200,94,.7);
    }

    .status-details{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:7px;
      max-height:90px;
      opacity:1;
      transform:translateY(0);
      transition:opacity 180ms ease,transform 180ms ease,max-height 180ms ease;
    }

    .status-stack.collapsed .status-details{
      max-height:0;
      opacity:0;
      transform:translateY(-6px);
      pointer-events:none;
      overflow:hidden;
    }

    .state-button{
      max-width:310px;
      padding:8px 11px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      background:rgba(0,0,0,.78);
      color:#ddd;
      font:800 11px/1.2 system-ui,-apple-system,sans-serif;
      letter-spacing:.055em;
      text-align:left;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .state-button.ready{
      border-color:rgba(47,200,94,.72);
      color:#8df0aa;
    }

    .state-button.warning{
      border-color:rgba(255,188,63,.72);
      color:#ffd27a;
    }

    .dock{
      position:absolute;
      z-index:60;
      left:50%;
      bottom:max(12px,env(safe-area-inset-bottom));
      transform:translateX(-50%);
      width:min(980px,calc(100% - 26px));
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:10px;
      padding:10px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:18px;
      background:rgba(0,0,0,.82);
      box-shadow:0 14px 36px rgba(0,0,0,.45);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .dock button{
      min-height:54px;
      border:1px solid rgba(255,255,255,.17);
      border-radius:13px;
      background:#171717;
      color:#fff;
      font:800 16px/1.15 system-ui,-apple-system,sans-serif;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .dock button:active{transform:scale(.985)}

    .cutin-wrap{
      position:absolute;
      z-index:70;
      inset:0;
      display:grid;
      place-items:center;
      padding:24px;
      background:rgba(0,0,0,.26);
      opacity:0;
      pointer-events:none;
      transition:opacity 180ms ease;
    }

    .cutin-wrap.show{
      opacity:1;
      pointer-events:auto;
    }

    .cutin-card{
      width:min(700px,92vw);
      border:1px solid rgba(255,255,255,.22);
      border-radius:24px;
      background:var(--panel);
      color:var(--text);
      padding:clamp(22px,4vw,38px);
      box-shadow:0 24px 70px rgba(0,0,0,.58);
      text-align:center;
      transform:translateY(14px) scale(.985);
      transition:transform 180ms ease;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .cutin-wrap.show .cutin-card{transform:translateY(0) scale(1)}

    .cutin-eyebrow{
      color:#ff555a;
      font-weight:900;
      font-size:12px;
      letter-spacing:.13em;
      margin-bottom:8px;
    }

    .cutin-icon{
      font-size:clamp(44px,8vw,74px);
      line-height:1;
      margin-bottom:10px;
    }

    .cutin-title{
      margin:0;
      font-size:clamp(30px,5.5vw,54px);
      line-height:1.02;
      letter-spacing:-.035em;
    }

    .cutin-copy{
      margin:12px auto 20px;
      max-width:560px;
      color:var(--muted);
      font-size:clamp(16px,2.4vw,22px);
      line-height:1.35;
    }

    .cutin-actions{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:10px;
      max-width:520px;
      margin:0 auto;
    }

    .cutin-actions button{
      min-height:52px;
      border-radius:13px;
      font:850 16px system-ui,-apple-system,sans-serif;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    #cutinOpenBtn{
      border:1px solid var(--red);
      background:var(--red);
      color:#fff;
    }

    #cutinDismissBtn{
      border:1px solid rgba(255,255,255,.18);
      background:#171717;
      color:#ddd;
    }

    .cutin-progress{
      height:3px;
      margin:22px auto -4px;
      max-width:520px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.12);
    }

    .cutin-progress > span{
      display:block;
      width:100%;
      height:100%;
      background:var(--red);
      transform-origin:left center;
    }

    .cutin-wrap.show .cutin-progress > span{
      animation:cutinTimer 12s linear forwards;
    }

    @keyframes cutinTimer{
      from{transform:scaleX(1)}
      to{transform:scaleX(0)}
    }

    @media(max-width:680px){
      .dock{gap:7px;padding:8px}
      .dock button{font-size:14px;min-height:50px}
      .cutin-actions{grid-template-columns:1fr}
      .state-button{max-width:250px;font-size:10px}
    }
  </style>
</head>

<body>
  <main class="beta-shell">

    <iframe
      id="discoverFrame"
      src="index-v21-staged.html?v=20261004-fresh-assets1"
      title="Discover with Big Red"
      allow="autoplay; geolocation">
    </iframe>

    <div id="statusStack" class="status-stack" aria-label="Program readiness">

      <button
        id="statusToggle"
        class="status-toggle"
        type="button"
        title="Manage local Discover media"
        aria-label="Discover with Big Red. Manage local program media."
        aria-expanded="true">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Discover with Big Red</span>
      </button>

      <div id="statusDetails" class="status-details">

        <button
          id="programState"
          class="state-button warning"
          type="button">
          STREAMING PROGRAM
        </button>

        <button
          id="musicState"
          class="state-button warning"
          type="button">
          LOAD BACKGROUND MUSIC
        </button>

      </div>

      <input
        id="backgroundMusicFile"
        type="file"
        accept="audio/*,.m4a,.mp3,.wav,.mov,.mp4"
        hidden />

    </div>

    <nav id="dock" class="dock" aria-label="Discover quick actions">
      <button type="button" data-target="gamesBtn">🎮 Games</button>
      <button type="button" data-target="musicBtn">🎵 Music</button>
      <button type="button" data-target="driverBtn">👋 Meet Big Red</button>
      <button type="button" data-target="tipBtn">❤️ Tip</button>
      <button type="button" data-target="reviewBtn">⭐ Review</button>
    </nav>

    <audio
      id="backgroundAudio"
      preload="auto"
      loop
      playsinline
      aria-hidden="true">
    </audio>

    <section
      id="cutinWrap"
      class="cutin-wrap"
      aria-live="polite"
      aria-hidden="true">

      <div class="cutin-card">

        <div id="cutinEyebrow" class="cutin-eyebrow">DISCOVER SOMETHING</div>
        <div id="cutinIcon" class="cutin-icon">☀️</div>
        <h1 id="cutinTitle" class="cutin-title">Weather along the ride</h1>
        <p id="cutinCopy" class="cutin-copy">
          See the current conditions and the next few hours.
        </p>

        <div class="cutin-actions">
          <button id="cutinOpenBtn" type="button">Open Weather</button>
          <button id="cutinDismissBtn" type="button">Keep Watching</button>
        </div>

        <div class="cutin-progress" aria-hidden="true"><span></span></div>

      </div>
    </section>

  </main>

  <script>
  (() => {
    "use strict";

    const frame = document.getElementById("discoverFrame");
    const dock = document.getElementById("dock");

    const cutinWrap = document.getElementById("cutinWrap");
    const cutinEyebrow = document.getElementById("cutinEyebrow");
    const cutinIcon = document.getElementById("cutinIcon");
    const cutinTitle = document.getElementById("cutinTitle");
    const cutinCopy = document.getElementById("cutinCopy");
    const cutinOpenBtn = document.getElementById("cutinOpenBtn");
    const cutinDismissBtn = document.getElementById("cutinDismissBtn");

    const statusStack = document.getElementById("statusStack");
    const statusToggle = document.getElementById("statusToggle");
    const programState = document.getElementById("programState");
    const musicState = document.getElementById("musicState");

    const backgroundMusicFile = document.getElementById("backgroundMusicFile");
    const backgroundAudio = document.getElementById("backgroundAudio");

    const fastMode =
      new URLSearchParams(location.search).has("fast");

    const pageStartedAt = Date.now();

    // Preserve the existing feature-card cadence.
    const timing = fastMode
      ? {
          first:12000,
          min:18000,
          max:28000,
          tipAfter:60000
        }
      : {
          first:45000,
          min:50000,
          max:75000,
          tipAfter:720000
        };

    /*
      Commercials and shorts are now baked into the single local program.
      We keep the old 8-slot pattern only as a timing mask so feature cards
      appear at the same approximate frequency as before. Non-feature slots
      simply pass without showing another video insert.
    */
    const featureTimingPattern = [
      "program",
      "feature",
      "program",
      "program",
      "feature",
      "program",
      "program",
      "feature"
    ];

    const prompts = [
      {
        target:"weatherBtn",
        eyebrow:"CHECK THE RIDE AHEAD",
        icon:"☀️",
        title:"Weather along the ride",
        copy:"See current conditions and what the next few hours look like.",
        action:"Open Weather"
      },
      {
        target:"driverBtn",
        eyebrow:"YOU'RE RIDING WITH",
        icon:"👋",
        title:"Meet Big Red Dan",
        copy:"Veteran owned, local, and built around one trusted driver.",
        action:"Meet Your Driver"
      },
      {
        target:"gamesBtn",
        eyebrow:"WANT TO PLAY?",
        icon:"🎮",
        title:"Make the ride a little quicker",
        copy:"Trivia, Would You Rather, and Word Scramble are ready when you are.",
        action:"Play a Game"
      },
      {
        target:"musicBtn",
        eyebrow:"PICK THE VIBE",
        icon:"🎵",
        title:"Want different music?",
        copy:"Choose a Big Red playlist or send a specific song or artist request.",
        action:"Request Music"
      },
      {
        target:"planBtn",
        eyebrow:"KEEP BIG RED HANDY",
        icon:"📲",
        title:"Save your Rider Hub",
        copy:"Keep ride details, tracking, and easy access to Big Red in one place.",
        action:"Open Rider Hub"
      },
      {
        target:"tipBtn",
        eyebrow:"OPTIONAL",
        icon:"❤️",
        title:"Want to tip Big Red?",
        copy:"Tips are appreciated, never expected.",
        action:"Tip Big Red",
        lateOnly:true
      }
    ];

    let promptOrder = [];
    let promptPos = 0;
    let timingPos = 0;
    let currentPrompt = null;

    let cutinTimer = null;
    let scheduleTimer = null;
    let statusHideTimer = null;

    let frameReady = false;
    let programReady = false;
    let musicReady = false;

    let lastPromptTarget = "";
    let backgroundAudioUrl = "";
    let backgroundAudioReady = false;

    function frameDoc(){
      try{
        return frame.contentDocument || frame.contentWindow.document;
      }catch{
        return null;
      }
    }

    function embeddedDiscoverBadge(){
      const doc = frameDoc();
      return doc ? doc.getElementById("loadLocalProgramBtn") : null;
    }

    function presentationVideo(){
      const doc = frameDoc();
      return doc ? doc.getElementById("presentationVideo") : null;
    }

    function audioController(){
      try{
        return (
          frame.contentWindow &&
          frame.contentWindow.DiscoverAudioController
        ) || null;
      }catch{
        return null;
      }
    }

    function soundIsOn(){
      const controller = audioController();

      if(controller){
        try{
          return Boolean(controller.state().soundOn);
        }catch{}
      }

      const doc = frameDoc();

      return Boolean(
        doc
          ?.getElementById("volumeBtn")
          ?.classList
          .contains("sound-on")
      );
    }

    function applySharedSoundState(){
      const soundOn = soundIsOn();
      const mainVideo = presentationVideo();

      /*
        The merged program now contains the commercial/short audio.
        Keep that audio available when sound is on. Background music
        is a separate continuous layer, so both may play together.
      */
      if(mainVideo){
        mainVideo.muted = !soundOn;
      }

      backgroundAudio.muted = !soundOn;
    }

    function playBackgroundAudio(){
      if(!backgroundAudioReady){
        return;
      }

      applySharedSoundState();

      backgroundAudio
        .play()
        .catch(()=>{});
    }

    function loadBackgroundMusic(file){
      if(!file){
        return;
      }

      if(backgroundAudioUrl){
        URL.revokeObjectURL(backgroundAudioUrl);
      }

      backgroundAudio.pause();

      backgroundAudioReady = false;
      musicReady = false;

      backgroundAudioUrl = URL.createObjectURL(file);
      backgroundAudio.src = backgroundAudioUrl;
      backgroundAudio.loop = true;
      backgroundAudio.volume = 1;
      backgroundAudio.muted = !soundIsOn();

      musicState.textContent = "CHECKING BACKGROUND MUSIC…";
      musicState.classList.remove("ready");
      musicState.classList.add("warning");

      syncStatusUI(true);

      backgroundAudio.load();

      // File selection is the rider's direct gesture; use it to unlock audio.
      backgroundAudio.play().catch(()=>{});

      backgroundAudio.addEventListener(
        "canplay",
        ()=>{
          backgroundAudioReady = true;
          musicReady = true;

          musicState.textContent = "BACKGROUND MUSIC LOADED";
          musicState.classList.add("ready");
          musicState.classList.remove("warning");

          applySharedSoundState();
          playBackgroundAudio();
          syncStatusUI(true);
        },
        {once:true}
      );

      backgroundAudio.addEventListener(
        "error",
        ()=>{
          backgroundAudioReady = false;
          musicReady = false;

          musicState.textContent = "SELECT BACKGROUND MUSIC";
          musicState.classList.remove("ready");
          musicState.classList.add("warning");

          syncStatusUI(true);
        },
        {once:true}
      );
    }

    function visibleInnerPanel(){
      const doc = frameDoc();

      if(!doc){
        return false;
      }

      return [...doc.querySelectorAll(".overlay-panel")]
        .some(panel => !panel.hidden);
    }

    function pressInnerButton(id){
      const doc = frameDoc();
      const button = doc ? doc.getElementById(id) : null;

      if(!button){
        return false;
      }

      button.click();
      return true;
    }

    function shuffle(items){
      const result = [...items];

      for(let i = result.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function eligiblePrompts(){
      const tipUnlocked =
        Date.now() - pageStartedAt >= timing.tipAfter;

      return prompts.filter(
        prompt => !prompt.lateOnly || tipUnlocked
      );
    }

    function nextPrompt(){
      const eligible = eligiblePrompts();
      const eligibleTargets =
        new Set(eligible.map(prompt => prompt.target));

      promptOrder = promptOrder.filter(
        index => eligibleTargets.has(prompts[index]?.target)
      );

      if(
        !promptOrder.length ||
        promptPos >= promptOrder.length
      ){
        promptOrder = shuffle(
          prompts
            .map((prompt,index)=>({prompt,index}))
            .filter(
              item => eligibleTargets.has(item.prompt.target)
            )
            .map(item => item.index)
        );

        if(
          promptOrder.length > 1 &&
          prompts[promptOrder[0]].target === lastPromptTarget
        ){
          [promptOrder[0], promptOrder[1]] =
            [promptOrder[1], promptOrder[0]];
        }

        promptPos = 0;
      }

      const prompt = prompts[promptOrder[promptPos++]];
      lastPromptTarget = prompt.target;

      return prompt;
    }

    function collapseStatus(){
      clearTimeout(statusHideTimer);

      statusStack.classList.add("collapsed");
      statusToggle.setAttribute("aria-expanded","false");

      const badge = embeddedDiscoverBadge();

      if(badge){
        badge.setAttribute("aria-expanded","false");
      }
    }

    function revealStatus(autoHide = false){
      clearTimeout(statusHideTimer);

      statusStack.classList.remove("collapsed");
      statusToggle.setAttribute("aria-expanded","true");

      const badge = embeddedDiscoverBadge();

      if(badge){
        badge.setAttribute("aria-expanded","true");
      }

      if(
        autoHide &&
        programReady &&
        musicReady
      ){
        statusHideTimer =
          setTimeout(collapseStatus,5000);
      }
    }

    function syncStatusUI(reveal = false){
      const allReady =
        programReady &&
        musicReady;

      statusToggle.classList.toggle("ready",allReady);

      const badge = embeddedDiscoverBadge();

      if(badge){
        badge.classList.toggle("media-ready",allReady);

        badge.setAttribute(
          "aria-label",
          allReady
            ? "Discover with Big Red. Program and background music ready. Manage media."
            : "Discover with Big Red. Manage local program media."
        );

        badge.title =
          allReady
            ? "Program and background music ready — tap to manage"
            : "Tap to load local program media";
      }

      if(reveal){
        revealStatus(allReady);
      }
    }

    function setProgramState(){
      const doc = frameDoc();

      const localStatus =
        doc
          ? doc.getElementById("localProgramStatus")
          : null;

      const localVideo = presentationVideo();

      const localLoaded = Boolean(
        (
          localStatus &&
          !localStatus.hidden
        )
        ||
        localVideo?.src?.startsWith("blob:")
      );

      const changed =
        localLoaded !== programReady;

      programReady = localLoaded;

      programState.textContent =
        localLoaded
          ? "LOCAL PROGRAM LOADED"
          : "STREAMING PROGRAM";

      programState.classList.toggle("ready",localLoaded);
      programState.classList.toggle("warning",!localLoaded);

      syncStatusUI(changed);
    }

    function scheduleNext(delay){
      clearTimeout(scheduleTimer);

      const wait =
        delay ??
        (
          timing.min +
          Math.round(
            Math.random() *
            (timing.max - timing.min)
          )
        );

      scheduleTimer =
        setTimeout(runNextFeatureSlot,wait);
    }

    function hideCutin(){
      clearTimeout(cutinTimer);

      cutinWrap.classList.remove("show");
      cutinWrap.setAttribute("aria-hidden","true");

      currentPrompt = null;

      scheduleNext();
    }

    function showCutin(prompt){
      if(
        !prompt ||
        !frameReady ||
        cutinWrap.classList.contains("show") ||
        visibleInnerPanel()
      ){
        scheduleNext(12000);
        return;
      }

      currentPrompt = prompt;

      cutinEyebrow.textContent = prompt.eyebrow;
      cutinIcon.textContent = prompt.icon;
      cutinTitle.textContent = prompt.title;
      cutinCopy.textContent = prompt.copy;
      cutinOpenBtn.textContent = prompt.action;

      cutinWrap.classList.add("show");
      cutinWrap.setAttribute("aria-hidden","false");

      clearTimeout(cutinTimer);

      cutinTimer =
        setTimeout(hideCutin,12000);
    }

    function runNextFeatureSlot(){
      if(
        !frameReady ||
        visibleInnerPanel() ||
        cutinWrap.classList.contains("show")
      ){
        scheduleNext(12000);
        return;
      }

      const slot =
        featureTimingPattern[
          timingPos++ %
          featureTimingPattern.length
        ];

      if(slot === "feature"){
        showCutin(nextPrompt());
      }else{
        scheduleNext();
      }
    }

    function installBetaLayer(){
      const doc = frameDoc();

      if(!doc){
        return;
      }

      frameReady = true;

      const oldStyle =
        doc.getElementById("programBetaOverrides");

      if(oldStyle){
        oldStyle.remove();
      }

      const style = doc.createElement("style");
      style.id = "programBetaOverrides";
      style.textContent = [
        ".discover-actions{display:none!important}",
        ".home-view{padding-bottom:82px!important}",
        "#loadLocalProgramBtn{display:none!important}"
      ].join("");

      doc.head.appendChild(style);

      const badge =
        doc.getElementById("loadLocalProgramBtn");

      if(badge){
        badge.setAttribute("aria-hidden","true");
        badge.setAttribute("tabindex","-1");
      }

      const volumeButton =
        doc.getElementById("volumeBtn");

      const mainVideo = presentationVideo();

      if(
        mainVideo &&
        mainVideo.dataset.mergedProgramAudioBridge !== "ready"
      ){
        mainVideo.dataset.mergedProgramAudioBridge = "ready";

        mainVideo.addEventListener(
          "play",
          ()=>{
            // Keep the merged program's embedded insert audio available.
            applySharedSoundState();

            window.setTimeout(
              playBackgroundAudio,
              120
            );
          }
        );
      }

      if(volumeButton){
        volumeButton.addEventListener(
          "click",
          ()=>{
            applySharedSoundState();
            playBackgroundAudio();
          }
        );
      }

      doc.addEventListener(
        "pointerdown",
        ()=>{
          applySharedSoundState();
          playBackgroundAudio();
        },
        {passive:true}
      );

      setProgramState();

      scheduleNext(timing.first);
    }

    document
      .querySelectorAll(".dock button[data-target]")
      .forEach(button=>{
        button.addEventListener(
          "click",
          ()=>{
            clearTimeout(scheduleTimer);
            clearTimeout(cutinTimer);

            if(cutinWrap.classList.contains("show")){
              cutinWrap.classList.remove("show");
              cutinWrap.setAttribute("aria-hidden","true");
            }

            currentPrompt = null;

            pressInnerButton(button.dataset.target);

            scheduleNext();
          }
        );
      });

    cutinOpenBtn.addEventListener(
      "click",
      ()=>{
        if(!currentPrompt){
          return;
        }

        const target = currentPrompt.target;

        clearTimeout(cutinTimer);

        cutinWrap.classList.remove("show");
        cutinWrap.setAttribute("aria-hidden","true");

        currentPrompt = null;

        pressInnerButton(target);

        scheduleNext();
      }
    );

    cutinDismissBtn.addEventListener(
      "click",
      hideCutin
    );

    statusToggle.addEventListener(
      "click",
      ()=>{
        if(statusStack.classList.contains("collapsed")){
          revealStatus(false);
        }else{
          collapseStatus();
        }
      }
    );

    programState.addEventListener(
      "click",
      ()=>{
        const doc = frameDoc();

        if(!doc){
          return;
        }

        const controller = audioController();
        const fileInput =
          doc.getElementById("localProgramFile");

        if(controller){
          controller
            .unlockAndPlay()
            .catch(()=>{});
        }

        if(fileInput){
          fileInput.value = "";

          const restoreAfterSelection = ()=>{
            window.setTimeout(
              ()=>{
                const currentController =
                  audioController();

                if(currentController){
                  currentController
                    .ensurePlayback()
                    .catch(()=>{});
                }

                applySharedSoundState();
                playBackgroundAudio();
              },
              250
            );
          };

          fileInput.addEventListener(
            "change",
            restoreAfterSelection,
            {once:true}
          );

          fileInput.click();
        }
      }
    );

    musicState.addEventListener(
      "click",
      ()=>{
        backgroundMusicFile.value = "";
        backgroundMusicFile.click();
      }
    );

    backgroundMusicFile.addEventListener(
      "change",
      ()=>{
        const file =
          backgroundMusicFile.files &&
          backgroundMusicFile.files[0];

        loadBackgroundMusic(file);
      }
    );

    frame.addEventListener(
      "load",
      installBetaLayer
    );

    setInterval(
      ()=>{
        setProgramState();
        applySharedSoundState();

        if(
          backgroundAudioReady &&
          backgroundAudio.paused
        ){
          playBackgroundAudio();
        }
      },
      1000
    );

    document.addEventListener(
      "visibilitychange",
      ()=>{
        if(document.hidden){
          clearTimeout(scheduleTimer);
          return;
        }

        applySharedSoundState();
        playBackgroundAudio();
        scheduleNext(12000);
      }
    );

    window.addEventListener(
      "pagehide",
      ()=>{
        if(backgroundAudioUrl){
          URL.revokeObjectURL(backgroundAudioUrl);
        }
      },
      {once:true}
    );

  })();
  </script>

</body>
</html>
